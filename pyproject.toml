[project]
name = "axiom"
version = "0.1.0"
description = "A minimal agent."
requires-python = ">=3.12"
dependencies = [
    "ollama>=0.4",
    "httpx>=0.27",
    "psutil>=7.2.2",
    "ddgs>=9.15.0",
    "trafilatura>=2.2.0",
    "mcp>=2.1.1",
    "rich>=14.2.0",
    "croniter>=6.0.0",
    "python-frontmatter>=1.3.0",
    # Reads a key rather than a line (#80). `input()` is line-buffered, so the
    # console's line discipline eats the newline and axiom never sees which key
    # produced it - and ctrl+enter is 0a where enter is 0d. Chosen over a
    # hand-rolled reader because seeing the key means owning backspace, arrows,
    # home, end and history from that moment; over pyreadline3, which is
    # line-oriented by construction; and over textual or urwid, which take the
    # alternate screen and would fight `Rendered`. One dependency of its own,
    # `wcwidth`, and BSD. The survey is in .claude/loop/80-multiline.
    "prompt_toolkit>=3.0.53",
]

[project.scripts]
axiom = "axiom:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/axiom"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
# Live-model tests are excluded from the default run. They need Ollama, they
# take minutes rather than milliseconds, and a suite that quietly acquires a
# network dependency makes every wall-clock measurement in this loop
# meaningless. Run them with: uv run pytest -m live
addopts = "-m 'not live'"
markers = [
    "live: needs a running Ollama and real models; excluded by default",
]
