[project]
name = "axiom"
version = "0.1.0"
description = "A minimal agent."
requires-python = ">=3.12"
dependencies = [
    "ollama>=0.4",
    "httpx>=0.27",
    "psutil>=7.2.2",
    "ddgs>=9.15.0",
    "trafilatura>=2.2.0",
    "mcp>=2.1.1",
]

[project.scripts]
axiom = "axiom:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/axiom"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
